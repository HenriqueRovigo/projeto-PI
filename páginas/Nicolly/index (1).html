<body>
    <header>
        <div class="topo">
            <img src="../Imagens/logo.png" alt="LOGO-FOTO" width="130">
        </div>
        <div class="topo">
            <nav>
                <ul>
                    <li>

                    <li>

                        <a href="../Emanuel/index (1).html">Quiz</a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <section class="primeiro">

            <h2>Tem uma nova informação sobre os Maias?</h2>
            <p>Envie aqui para a gente atualizar o site.</p>

            <form action="#" method="post">
                <div class="campo">
                    <label for="nome">1 - Nome ou pseudônimo</label>
                    <input type="text" id="nome" name="nome" placeholder="Ex: Ana, historiadora" required>
                    <span>Só pra saber quem enviou</span>
                </div>

                <div class="campo">
                    <label for="fonte">2 - Onde você viu essa informação?</label>
                    <input type="text" id="fonte" name="fonte" placeholder="Ex: site, livro, YouTube, link" required>
                </div>

                <div class="campo">
                    <label for="contato">3 - Seu contato</label>
                    <input type="text" id="contato" name="contato" placeholder="Ex: e-mail ou @instagram" required>
                </div>

                <div class="campo">
                    <label for="mensagem">O que é a nova informação?</label>
                    <textarea id="mensagem" name="mensagem" rows="5"
                        placeholder="Escreva aqui a atualização..."></textarea>
                </div>

                <button type="submit">Enviar informação</button>
            </form>

        </section>
    </main>
    <footer>
        <p>
            <a href="https://www.instagram.com/sitecivilizacaomaia?igsh=MWUxOG5sbzI2cTRmcg==">
